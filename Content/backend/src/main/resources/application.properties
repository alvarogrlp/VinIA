spring.application.name=backend
# File-based h2 database for persistence
spring.datasource.url=jdbc:h2:file:./data/viniadb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
# Concurrency tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
server.port=8080
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.vinia.backend=DEBUG
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# AI Configuration (Gemini via OpenAI Compatibility)
# Disable auto-configuration to allow app to start without API key
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
# API key should be set via environment variable SPRING_AI_OPENAI_API_KEY
# or in application-local.properties (not committed to git)
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gemma-3-27b-it
spring.ai.openai.chat.options.temperature=0.7

