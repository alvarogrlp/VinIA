<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Copa de vino con circuito tecnológico -->
  <g id="vinia-logo">
    <!-- Base de la copa -->
    <path d="M206 440 C206 450, 256 450, 306 440 L306 420 C306 420, 256 425, 206 420 Z" fill="#C4A962"/>
    
    <!-- Tallo -->
    <rect x="246" y="340" width="20" height="80" fill="#C4A962"/>
    
    <!-- Parte superior de la copa -->
    <path d="M186 140 C186 140, 180 240, 200 300 C210 330, 246 340, 256 340 C266 340, 302 330, 312 300 C332 240, 326 140, 326 140 Z" fill="#C4A962" stroke="#C4A962" stroke-width="8"/>
    
    <!-- Vino dentro (parte oscura) -->
    <ellipse cx="256" cy="240" rx="70" ry="30" fill="#8B4545"/>
    <path d="M186 240 C186 240, 190 260, 200 280 C210 295, 230 305, 256 305 C282 305, 302 295, 312 280 C322 260, 326 240, 326 240 Z" fill="#8B4545"/>
    
    <!-- Borde de la copa -->
    <path d="M180 140 L332 140" stroke="#C4A962" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Circuitos tecnológicos -->
    <!-- Nodo 1 (arriba derecha) -->
    <circle cx="380" cy="160" r="18" fill="#C4A962"/>
    <circle cx="380" cy="160" r="10" fill="#F5F5F5"/>
    
    <!-- Nodo 2 (derecha) -->
    <circle cx="420" cy="220" r="18" fill="#C4A962"/>
    <circle cx="420" cy="220" r="10" fill="#F5F5F5"/>
    
    <!-- Nodo 3 (abajo derecha) -->
    <circle cx="400" cy="290" r="18" fill="#C4A962"/>
    <circle cx="400" cy="290" r="10" fill="#F5F5F5"/>
    
    <!-- Líneas de conexión -->
    <line x1="326" y1="200" x2="362" y2="165" stroke="#C4A962" stroke-width="6"/>
    <line x1="380" y1="178" x2="402" y2="210" stroke="#C4A962" stroke-width="6"/>
    <line x1="420" y1="238" x2="408" y2="272" stroke="#C4A962" stroke-width="6"/>
    
    <!-- Conexión al vino -->
    <line x1="326" y1="250" x2="382" y2="280" stroke="#C4A962" stroke-width="6"/>
    
    <!-- Pequeñas líneas decorativas de circuito -->
    <line x1="365" y1="155" x2="375" y2="145" stroke="#C4A962" stroke-width="4"/>
    <line x1="405" y1="205" x2="415" y2="195" stroke="#C4A962" stroke-width="4"/>
    <line x1="412" y1="290" x2="422" y2="300" stroke="#C4A962" stroke-width="4"/>
  </g>
</svg>
